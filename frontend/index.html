<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jargon - Policy Text Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #ffffff;
            --secondary-bg: #fafafa;
            --text-primary: #2c2c2c;
            --text-secondary: #666666;
            --border-color: #e5e5e5;
            --accent: #007acc;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            line-height: 1.6;
            font-weight: 300;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        .header {
            padding: 32px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.02em;
            margin: 0 auto;
        }

        .github-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            transition: color 0.2s ease;
            border-radius: 30px;
            background: var(--accent);
            padding: 10px;
            color: white;
        }

        /* Main Content */
        .main {
            padding: 64px 0;
            min-height: calc(100vh - 160px);
        }

        .input-section {
            margin-bottom: 64px;
            text-align: center;
        }

        .input-description {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-weight: 300;
        }

        .textarea {
            width: 100%;
            min-height: 300px;
            padding: 24px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            background: var(--primary-bg);
            color: var(--text-primary);
            resize: vertical;
            transition: border-color 0.2s ease;
            font-weight: 300;
            line-height: 1.8;
        }

        .textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .textarea::placeholder {
            color: var(--text-secondary);
            font-style: italic;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 8px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            margin-top: 24px;
            min-width: 160px;
        }

        .btn:hover {
            background: #005a99;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Results Section */
        .results-section {
            display: none;
            margin-top: 64px;
        }

        .results-section.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Entity Filters */
        .entity-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 32px;
            justify-content: center;
        }

        .entity-filter {
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 14px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
            background: var(--primary-bg);
            color: var(--text-secondary);
        }

        .entity-filter.active {
            color: white;
            border-color: transparent;
        }

        .entity-filter:hover {
            border-color: var(--accent);
        }

        /* Entity Colors - Minimal palette */
        .entity-PERSON, .entity-filter[data-entity="PERSON"].active { background: #e74c3c; }
        .entity-ORG, .entity-filter[data-entity="ORG"].active { background: #3498db; }
        .entity-GPE, .entity-filter[data-entity="GPE"].active { background: #9b59b6; }
        .entity-DATE, .entity-filter[data-entity="DATE"].active { background: #f39c12; }
        .entity-MONEY, .entity-filter[data-entity="MONEY"].active { background: #1abc9c; }
        .entity-PRODUCT, .entity-filter[data-entity="PRODUCT"].active { background: #34495e; }
        .entity-LAW, .entity-filter[data-entity="LAW"].active { background: #e67e22; }
        .entity-EMAIL, .entity-filter[data-entity="EMAIL"].active { background: #2ecc71; }
        .entity-MISC, .entity-filter[data-entity="MISC"].active { background: #95a5a6; }

        /* Policy Text */
        .policy-text {
            background: var(--secondary-bg);
            border-radius: 8px;
            padding: 32px;
            border: 1px solid var(--border-color);
            line-height: 1.8;
            font-size: 16px;
            font-weight: 300;
            max-width: 100%;
            box-shadow: var(--shadow);
        }

        .sentence {
            margin-bottom: 16px;
            position: relative;
        }

        .sentence.hidden {
            display: none;
        }

        .entity-highlight {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 400;
            position: relative;
            cursor: pointer;
            transition: opacity 0.2s ease;
            color: white;
        }

        .entity-highlight:hover {
            opacity: 0.8;
        }

        .entity-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--primary-bg);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 10;
            box-shadow: var(--shadow-md);
        }

        .entity-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid transparent;
            border-top-color: var(--text-primary);
        }

        .entity-highlight:hover .entity-tooltip {
            opacity: 1;
        }

        /* Footer */
        .footer {
            margin-top: 96px;
            padding: 32px 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .footer-text {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 300;
        }

        .footer-link {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: #005a99;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 48px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0 16px;
            }

            .logo {
                font-size: 36px;
            }

            .header-content {
                flex-direction: column;
                gap: 16px;
            }
            
            .github-link {
                margin: 0;
            }

            .main {
                padding: 32px 0;
            }

            .textarea {
                min-height: 240px;
                padding: 16px;
            }

            .policy-text {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="#" class="logo">Jargon</a>
                <a href="https://github.com/kernelism" class="github-link" target="_blank">⭐ Star on GitHub</a>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="input-section">
                <textarea 
                    id="policy-text" 
                    class="textarea" 
                    placeholder="Paste your privacy policy, terms of service, or any legal document here to analyze and identify key entities..."
                ></textarea>
                <input 
                    id="model-path" 
                    type="hidden" 
                    value="/Users/arjuns/Downloads/tnc/model"
                />
                <button class="btn" onclick="analyzePolicy()">
                    Analyze Text
                </button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p class="loading-text">Analyzing text...</p>
            </div>

            <div class="results-section" id="results">
                <div class="entity-filters" id="entity-filters">
                    <!-- Filters will be populated here -->
                </div>

                <div class="policy-text" id="policy-display">
                    <!-- Analyzed text will be displayed here -->
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="footer-text">
                Made with ❤️ by <a href="https://github.com/kernelism" class="footer-link" target="_blank">Kernelism</a>
            </p>
        </div>
    </footer>

    <script>
        let currentData = null;
        let activeFilters = new Set();

        // Analyze policy
        async function analyzePolicy() {
            const text = document.getElementById('policy-text').value.trim();
            const modelPath = document.getElementById('model-path').value.trim();
            
            if (!text) {
                alert('Please enter privacy policy text to analyze.');
                return;
            }

            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            
            loading.classList.add('show');
            results.classList.remove('show');

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        model_path: modelPath
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                currentData = data;
                displayResults(data);
                
            } catch (error) {
                console.error('Analysis failed:', error);
                alert('Analysis failed. Please check your model path and try again.');
            } finally {
                loading.classList.remove('show');
            }
        }

        // Display results
        function displayResults(data) {
            displayFilters(data);
            displayPolicyText(data);
            
            document.getElementById('results').classList.add('show');
        }

        // Display entity filters
        function displayFilters(data) {
            const filtersContainer = document.getElementById('entity-filters');
            const entityCounts = data.entity_summary;
            
            let filtersHTML = `
                <div class="entity-filter ${activeFilters.size === 0 ? 'active' : ''}" 
                     onclick="toggleFilter('all')">
                    All Entities (${data.total_entities})
                </div>
            `;
            
            Object.entries(entityCounts).forEach(([entity, count]) => {
                const isActive = activeFilters.has(entity);
                filtersHTML += `
                    <div class="entity-filter ${isActive ? 'active' : ''}" 
                         data-entity="${entity}"
                         onclick="toggleFilter('${entity}')">
                        ${entity} (${count})
                    </div>
                `;
            });
            
            filtersContainer.innerHTML = filtersHTML;
        }

        // Display policy text with entity highlighting
        function displayPolicyText(data) {
            const container = document.getElementById('policy-display');
            let html = '';
            
            data.sentences.forEach((sentence, index) => {
                const hasRelevantEntities = activeFilters.size === 0 || 
                    sentence.entities.some(entity => activeFilters.has(entity.label));
                
                const visibilityClass = hasRelevantEntities ? '' : 'hidden';
                
                let sentenceHTML = sentence.text;
                
                // Sort entities by start position (descending) to avoid offset issues
                const sortedEntities = [...sentence.entities].sort((a, b) => b.start - a.start);
                
                sortedEntities.forEach(entity => {
                    const shouldHighlight = activeFilters.size === 0 || activeFilters.has(entity.label);
                    
                    if (shouldHighlight) {
                        const start = entity.start - sentence.start;
                        const end = entity.end - sentence.start;
                        const originalText = sentenceHTML.substring(start, end);
                        
                        const highlightHTML = `
                            <span class="entity-highlight entity-${entity.label}">
                                ${originalText}
                                <div class="entity-tooltip">
                                    ${entity.label} (${(entity.confidence * 100).toFixed(1)}%)
                                </div>
                            </span>
                        `;
                        
                        sentenceHTML = sentenceHTML.substring(0, start) + 
                                     highlightHTML + 
                                     sentenceHTML.substring(end);
                    }
                });
                
                html += `<div class="sentence ${visibilityClass}">${sentenceHTML}</div>`;
            });
            
            container.innerHTML = html;
        }

        // Toggle entity filter
        function toggleFilter(entityType) {
            if (entityType === 'all') {
                activeFilters.clear();
            } else {
                if (activeFilters.has(entityType)) {
                    activeFilters.delete(entityType);
                } else {
                    activeFilters.add(entityType);
                }
            }
            
            if (currentData) {
                displayFilters(currentData);
                displayPolicyText(currentData);
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Focus on textarea
            document.getElementById('policy-text').focus();
        });

        // Handle enter key in textarea
        document.getElementById('policy-text').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                analyzePolicy();
            }
        });
    </script>
</body>
</html>
