[tool.poetry]
name = "tnc"
version = "0.1.0"
description = "Named Entity Recognition project"
authors = []
license = "MIT"
readme = "README.md"

# Use src/ layout and include any top-level packages inside src
packages = [
  { include = "*", from = "src" }
]

[tool.poetry.dependencies]
# Many NLP libs (spaCy/torch) don't support Python 3.13 yet; target 3.11-3.12
python = ">=3.11,<3.13"
numpy = "^2.3.2"
datasets = "^4.0.0"
transformers = "^4.55.0"
seqeval = "^1.2.2"
spacy = "^3.8.7"
torch = "^2.8.0"
openai = "^1.99.7"
tenacity = "^9.1.2"
tqdm = "^4.67.1"
pandas = "^2.3.1"
accelerate = "^1.10.0"
click = "^8.2.1"
nltk = "^3.9.1"
fastapi = "^0.116.1"
uvicorn = "^0.35.0"
pydantic = "^2.11.7"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
ruff = "^0.5.6"
mypy = "^1.10.0"
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
ipykernel = "^6.29.5"
jupyter = "^1.0.0"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

